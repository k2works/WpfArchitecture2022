site_name: AdventureWorks 購買管理システム
site_description: Clean Architecture と Domain-Driven Design を採用したWPF業務アプリケーション
site_author: WpfArchitecture2022 Team
repo_url: https://github.com/k2works/WpfArchitecture2022
repo_name: WpfArchitecture2022

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

extra_css:
  - docs/mkdocs/assets/css/extra.css

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: plantuml
          class: plantuml
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist
  - pymdownx.emoji
  - admonition
  - toc:
      permalink: true
  - plantuml_markdown:
      server: !!python/object/apply:os.getenv
        - PLANTUML_SERVER_URL
        - http://www.plantuml.com/plantuml
      format: svg

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js
  - docs/assets/js/extra.js

extra:
  plantuml_url: http://www.plantuml.com/plantuml
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/k2works
      name: GitHub Repository/claude-code-booster

plugins:
  - search

nav:
  - ホーム: index.md
  - 要件定義:
    - 要件定義概要: requirements/requirements_definition.md
    - ビジネスユースケース: requirements/business_usecase.md
    - システムユースケース: requirements/system_usecase.md
    - ユーザーストーリー: requirements/user_story.md
  - 設計:
    - 技術スタック: design/tech_stack.md
    - バックエンドアーキテクチャ: design/architecture_backend.md
    - フロントエンドアーキテクチャ: design/architecture_frontend.md
    - データモデル: design/data-model.md
    - ドメインモデル: design/domain-model.md
    - UI設計: design/ui_design.md
    - テスト戦略: design/test_strategy.md
    - 非機能要件: design/non-functional.md
    - 運用要件: design/operation.md
  - リファレンス:
    - よいソフトウェアとは: reference/よいソフトウェアとは.md
    - 開発ガイド: reference/開発ガイド.md
    - アーキテクチャ設計ガイド: reference/アーキテクチャ設計ガイド.md
    - データモデル設計ガイド: reference/データモデル設計ガイド.md
    - ドメインモデル設計ガイド: reference/ドメインモデル設計ガイド.md
